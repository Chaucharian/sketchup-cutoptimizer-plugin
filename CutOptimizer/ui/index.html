<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cut Optimizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="input-group">
      <label>Proyecto</label>
      <input type="text" id="projectName" class="name-input" value="Mueble">
    </div>
    <div class="input-group">
      <label>Largo Placa (mm)</label>
      <input type="number" id="boardL" class="dim-input" value="2750">
    </div>
    <div class="input-group">
      <label>Ancho Placa (mm)</label>
      <input type="number" id="boardW" class="dim-input" value="1840">
    </div>
    <div class="input-group">
      <label>Espesor Placa (mm)</label>
      <input type="number" id="boardT" class="dim-input" value="18">
    </div>
    <div class="input-group">
      <label>Kerf (mm)</label>
      <input type="number" id="kerf" class="dim-input" value="4">
    </div>
    <div class="input-group">
      <label>Espesor (mm)</label>
      <input type="number" id="boardThickness" class="dim-input" value="18">
    </div>
    <button id="calcBtn">Calcular Cortes</button>
    <button id="exportBtn" class="btn-export" onclick="window.print()">Exportar PDF</button>
    <button id="themeToggle" class="btn-theme icon-btn" aria-label="Cambiar Tema">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
  
  <details id="filter-container" style="display:none;" class="filter-panel">
    <summary>Filtrar Piezas (Ocultar decoración, etc.)</summary>
    <div id="filter-list" class="filter-list"></div>
  </details>

  <div id="stats" style="display:none;" class="stats"></div>
  
  <div id="canvas-container">
    <p id="placeholder" style="color:var(--text-muted); margin-top: 80px; text-align:center; font-size: 15px;">Seleccioná geometría en SketchUp y hacé clic en "Calcular Cortes".</p>
  </div>

  <div id="cut-list"></div>

  <div class="tooltip" id="tooltip">
    <h4 id="tt-name">Nombre</h4>
    <p>Dimensiones: <span id="tt-dims"></span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
